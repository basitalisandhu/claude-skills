name: ci

on:
  push:
    branches: [main]
  pull_request:
  # sync.yml starts this on the sync branch: pull requests opened with GITHUB_TOKEN start no
  # workflows, but a workflow_dispatch does (issue #24). Its check runs are not listed on the pull
  # request, so the report-to-pr job below posts the result as commit statuses.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, build check and tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
        include:
          # install.py claims Windows support, so run the tests there too (tests/ only).
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Windows-specific skip: validate.py and the site build read the whole tree through git and
      # POSIX paths, so they run on Linux and macOS only. The Windows leg runs tests/ and nothing else.
      - name: Structure, front matter, generated files and house rules
        if: runner.os != 'Windows'
        run: python3 scripts/validate.py --strict-quality
      - name: Site is up to date and every internal link resolves
        if: runner.os != 'Windows'
        run: python3 site/build.py --check
      - run: python -m pip install pytest hypothesis
      - name: Tests (tests/ only on Windows)
        run: python -m pytest -q tests/

  claude-plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and every plugin
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done

  bundled-checks:
    name: Bundled workflow linter and secrets scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lint this repository's workflows with the devops plugin's linter
        run: python3 plugins/devops/skills/github-actions-author/scripts/gha_lint.py .github/workflows --fail-on medium
      - name: Scan this repository with the security-basics plugin's secrets scanner
        run: python3 plugins/security-basics/skills/secrets-hygiene/scripts/secrets_scan.py . --fail-on high --baseline .secrets-baseline.json

  # Check runs from a workflow_dispatch run are not listed on a pull request, but commit statuses
  # are. On a dispatched run off main (the sync branch), post one "ci / <job>" status per job on
  # the commit, replacing the pending ones sync.yml set. Skipped when the run is cancelled, since
  # the run that cancelled it reports instead.
  report-to-pr:
    name: Report the result as commit statuses
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
    needs: [validate, claude-plugin-validate, bundled-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the statuses
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATE: ${{ needs.validate.result }}
          PLUGIN_VALIDATE: ${{ needs.claude-plugin-validate.result }}
          BUNDLED: ${{ needs.bundled-checks.result }}
        run: |
          post() {
            case "$2" in
              success) state=success ;;
              failure) state=failure ;;
              *) state=error ;;
            esac
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="ci / $1" \
              -f description="Job result: $2" -f target_url="$RUN_URL" > /dev/null
            echo "ci / $1: $state"
          }
          post "Validate, build check and tests" "$VALIDATE"
          post "claude plugin validate --strict" "$PLUGIN_VALIDATE"
          post "Bundled workflow linter and secrets scanner" "$BUNDLED"
