name: sync
# Registered on the default branch; see CONTRIBUTING.md for how to run it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync plugins from the source repositories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      operation: ${{ steps.cpr.outputs.pull-request-operation }}
      pr-url: ${{ steps.cpr.outputs.pull-request-url }}
      head-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Sync (clones the public source repositories over https)
        run: python3 scripts/sync.py --summary sync-summary.md
      - name: Validate
        run: python3 scripts/validate.py --strict-quality
      - name: Build and check the site
        run: |
          python3 site/build.py
          python3 site/build.py --check
      - name: Tests
        run: |
          python3 -m pip install pytest hypothesis
          python3 -m pytest -q
      - name: Open or update the sync pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/plugins
          delete-branch: true
          commit-message: "sync: update plugins from source repositories"
          title: "sync: update plugins from source repositories"
          body-path: sync-summary.md
          labels: sync
          add-paths: |
            plugins
            docs
            reports
            README.md
            SOURCES.json
            catalog.json
            .claude-plugin/marketplace.json

  # A pull request opened or updated with GITHUB_TOKEN starts no other workflow, so ci.yml would
  # never run on it. A workflow_dispatch is the exception: start ci.yml on the branch (issue #24).
  # Two things GitHub does on top of that:
  # - check runs from a workflow_dispatch run are not listed on the pull request, so ci.yml
  #   reports its result as commit statuses named "ci / <job>"; this job sets them to pending first;
  # - the pull_request event still creates a ci.yml run for the bot, held at "action_required"
  #   (approval for first-time contributors; the API reports status "completed" with conclusion
  #   "action_required"), which marks the pull request unstable. It would only
  #   repeat the dispatched run, so this job deletes it. Only runs of ci.yml for this head commit,
  #   on sync/plugins, by github-actions[bot] are touched; approval for everyone else is unchanged.
  # This is its own job so that actions: write is never held by the job that runs the synced code.
  start-ci:
    name: Start ci on the sync branch
    needs: sync
    if: needs.sync.outputs.operation == 'created' || needs.sync.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      statuses: write
    steps:
      - name: Mark the ci checks pending on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.sync.outputs.head-sha }}
        run: |
          for job in "Validate, build check and tests" "claude plugin validate --strict" "Bundled workflow linter and secrets scanner"; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="ci / $job" \
              -f description="Started by the sync workflow" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/ci.yml" > /dev/null
          done
      - name: Run ci.yml on sync/plugins
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ needs.sync.outputs.pr-url }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref sync/plugins
          echo "Started ci.yml on sync/plugins for $PR_URL"
      - name: Remove the pull_request run that waits for approval
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.sync.outputs.head-sha }}
        run: |
          query='.workflow_runs[] | select(.event == "pull_request" and .conclusion == "action_required"
            and .head_branch == "sync/plugins" and .path == ".github/workflows/ci.yml"
            and .actor.login == "github-actions[bot]") | .id'
          for attempt in 1 2 3 4 5 6; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request" --jq "$query")
            if [ -n "$ids" ]; then
              for id in $ids; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
                echo "Deleted run $id (pull_request, action_required, github-actions[bot])"
              done
              exit 0
            fi
            sleep 10
          done
          echo "No pull_request run waiting for approval on $SHA"
